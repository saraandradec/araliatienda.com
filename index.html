<style>
/* Layout: una sola pantalla; grid sutil + resplandor; entrada escalonada por elemento */
:root{
  --fondo:#3A0F28; --fondo-luz:#5D2044;
  --crema:#F3F7EF; --rosa:#E2B4C4; --champagne:#C8A46A;
  --display:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --texto:'Jost','Helvetica Neue',Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%;overflow-x:hidden}
body{
  margin:0;color:var(--crema);font-family:var(--texto);
  background:radial-gradient(ellipse 80% 70% at 50% 45%,var(--fondo-luz) 0%,var(--fondo) 100%) var(--fondo);
  padding-block:0;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));
  min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;
}
body::before{
  content:'';position:absolute;inset:0;pointer-events:none;opacity:.55;
  background-image:
    repeating-linear-gradient(90deg,rgba(243,247,239,.06) 0 1px,transparent 1px 72px),
    repeating-linear-gradient(0deg,rgba(243,247,239,.06) 0 1px,transparent 1px 72px);
  background-size:72px 72px;
}
.glow{
  position:absolute;top:36%;left:50%;width:min(72vw,640px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,rgba(226,180,196,.32) 0%,rgba(226,180,196,0) 72%);
  filter:blur(6px);transform:translate(-50%,-50%);pointer-events:none;
}
main{position:relative;z-index:1;width:100%;max-width:720px;padding-block:96px 120px;display:flex;flex-direction:column;align-items:center;text-align:center}
.logo{width:min(80vw,540px);height:auto;display:block;opacity:0}
.regla{position:relative;width:1px;height:56px;margin:44px 0 40px;overflow:hidden;
  background:linear-gradient(var(--champagne),rgba(200,164,106,0));opacity:0}
.regla::after{content:'';position:absolute;left:-1px;right:-1px;height:22%;top:-25%;
  background:linear-gradient(var(--crema) 0%,rgba(243,247,239,0) 100%)}
h1{margin:0;font-family:var(--display);font-style:italic;font-weight:300;font-size:clamp(34px,6vw,56px);line-height:1.08;color:var(--rosa);text-wrap:balance;letter-spacing:.005em}
h1 span{display:inline-block;opacity:0}
p.sub{margin:22px 0 0;font-weight:300;font-size:clamp(14px,1.9vw,17px);letter-spacing:.22em;text-transform:uppercase;line-height:1.5;color:rgba(243,247,239,.82);text-wrap:balance;opacity:0}
.proximo{position:absolute;z-index:1;left:0;right:0;bottom:max(40px,env(safe-area-inset-bottom,0px));display:flex;justify-content:center;align-items:center;gap:20px;
  font-size:11px;font-weight:500;letter-spacing:.38em;text-transform:uppercase;margin:0;opacity:0;
  background:linear-gradient(100deg,var(--champagne) 42%,var(--crema) 50%,var(--champagne) 58%);
  background-size:260% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.proximo i{display:block;width:40px;height:1px;background:var(--champagne);opacity:.7}
@media (max-width:480px){main{padding-block:72px 120px}.regla{margin:36px 0 32px;height:44px}.proximo{letter-spacing:.3em;gap:14px}.proximo i{width:24px}}
@media (prefers-reduced-motion:no-preference){
  body::before{animation:gridDrift 48s linear infinite}
  .glow{animation:respira 9s ease-in-out infinite}
  .logo{animation:sube .9s ease-out .1s both}
  .regla{animation:crece 1.1s ease-out .55s both}
  .regla::after{animation:brillo 3.6s ease-in-out 2.2s infinite}
  h1 span{animation:sube .8s ease-out both}
  h1 span:nth-child(1){animation-delay:.85s}
  h1 span:nth-child(2){animation-delay:.95s}
  h1 span:nth-child(3){animation-delay:1.05s}
  h1 span:nth-child(4){animation-delay:1.15s}
  h1 span:nth-child(5){animation-delay:1.25s}
  p.sub{animation:sube .9s ease-out 1.5s both}
  .proximo{animation:sube .9s ease-out 1.75s both,brilloTexto 5s ease-in-out 3s infinite}
}
@media (prefers-reduced-motion:reduce){.logo,.regla,h1 span,p.sub,.proximo{opacity:1}}
@keyframes sube{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes crece{from{opacity:0;transform:scaleY(0)}to{opacity:1;transform:scaleY(1)}}
@keyframes gridDrift{from{background-position:0 0,0 0}to{background-position:72px 144px,-72px 72px}}
@keyframes respira{0%,100%{opacity:.55;transform:translate(-50%,-50%) scale(1)}50%{opacity:.85;transform:translate(-50%,-52%) scale(1.08)}}
@keyframes brillo{0%{top:-25%}100%{top:125%}}
@keyframes brilloTexto{0%,100%{background-position:260% 0}50%{background-position:-40% 0}}
</style>
</head>
